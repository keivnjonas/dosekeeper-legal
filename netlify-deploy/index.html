     host when serving from anywhere but the production path. -->

<style>
/* ============================================================
   Burned mix CD. Single theme on purpose - a disc on a dark
   table - so every colour is painted explicitly.
   ============================================================ */
*{box-sizing:border-box;}
body{
  margin:0;padding:18px 12px 44px;background:#0A0A0C;color:#EDEDED;
  font-family:"Helvetica Neue",Arial,sans-serif;font-size:14px;
  -webkit-text-size-adjust:100%;
}
a{color:#8FD0FF;}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #E8368F;outline-offset:2px;}

.wrap{max-width:660px;margin:0 auto;}

/* the disc, live */
.disc-stage{position:relative;margin:0 0 18px;}
#disc{width:100%;height:auto;display:block;}
.disc-cap{
  text-align:center;font-size:11px;color:#6E6E76;letter-spacing:.14em;
  text-transform:uppercase;margin-top:6px;
}

.panel{background:#131317;border:1px solid #26262E;}
.panel h2{
  margin:0;padding:11px 14px;font:700 12px/1 "Helvetica Neue",Arial,sans-serif;
  letter-spacing:.18em;text-transform:uppercase;color:#E8368F;
  border-bottom:1px solid #26262E;
}
.fields{padding:14px;display:flex;flex-direction:column;gap:12px;}
.fields label{display:block;font-size:10px;color:#8A8A94;letter-spacing:.16em;
  text-transform:uppercase;margin-bottom:5px;}
.fields input{
  width:100%;background:#0B0B0E;border:1px solid #2E2E38;color:#FFF;
  font-family:"Caveat","Comic Sans MS",cursive;font-size:22px;padding:7px 10px;
}
.fields input:focus{border-color:#E8368F;background:#150E13;}

/* tracklist */
.tracks{list-style:none;margin:0;padding:0;}
.tr{display:flex;gap:9px;align-items:center;padding:8px 12px;border-top:1px solid #212129;}
.tr .n{
  width:24px;flex:0 0 24px;text-align:right;color:#E8368F;
  font:700 13px "Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums;
}
.tr .f{flex:1;min-width:0;display:flex;gap:8px;}
.tr .f input{
  min-width:0;background:#0B0B0E;border:1px solid #2A2A33;color:#FFF;
  font-family:"Caveat","Comic Sans MS",cursive;font-size:21px;padding:6px 9px;
}
.tr .f .t{flex:3;}
.tr .f .a{flex:2;}
.tr .f input:focus{border-color:#E8368F;background:#150E13;}
.tr .ctl{display:flex;gap:3px;flex:0 0 auto;}
.tr .ctl button{
  width:30px;height:30px;background:#1D1D24;border:1px solid #33333D;color:#B8B8C2;
  font-size:12px;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center;
}
.tr .ctl button:hover{background:#26262E;color:#FFF;border-color:#E8368F;}
.tr .ctl button[disabled]{opacity:.25;cursor:default;}

/* track one is written in permanent marker */
.tr.locked{background:#171014;border-top:1px solid #E8368F;}
.tr.locked .n{color:#E8368F;}
.tr.locked .fixed{flex:1;min-width:0;}
.tr.locked .fixed b{
  display:block;font-family:"Rock Salt","Permanent Marker","Comic Sans MS",cursive;
  font-size:15px;font-weight:400;color:#FFF;line-height:1.35;
}
.tr.locked .fixed span{font-size:12px;color:#9A7A8C;}
.pin{
  flex:0 0 auto;background:#E8368F;color:#160309;font-size:9px;font-weight:700;
  padding:3px 6px;letter-spacing:.1em;
}

.actions{display:flex;flex-wrap:wrap;gap:8px;padding:14px;border-top:1px solid #26262E;}
.btn{
  font:600 13px "Helvetica Neue",Arial,sans-serif;padding:10px 14px;cursor:pointer;
  background:#1D1D24;border:1px solid #3A3A46;color:#EDEDED;
  display:inline-flex;align-items:center;justify-content:center;text-decoration:none;
}
.btn:hover{background:#26262E;border-color:#E8368F;}
.btn.go{background:#E8368F;border-color:#C01C6E;color:#180209;}
.btn.go:hover{background:#F455A2;}
.btn[disabled]{opacity:.4;cursor:default;}
.status{padding:0 14px 12px;font-size:12px;color:#E8368F;min-height:1.2em;}
.note{padding:0 14px 16px;font-size:11px;color:#70707A;line-height:1.7;}

/* spotify — the primary way in, so it sits above the manual list */
.sp{border-top:1px solid #26262E;padding:14px;}
.sp p{margin:0 0 10px;font-size:11px;color:#8A8A94;line-height:1.7;}
.sp-primary{
  background:#171115;border-top:2px solid #E8368F;border-bottom:1px solid #26262E;
  padding:16px 14px 18px;
}
.sp-primary h2{
  border:0;padding:0 0 8px;font-size:13px;letter-spacing:.18em;
}
.sp-primary p{font-size:12px;color:#A09AA4;}
.sp-primary .btn.go{font-size:15px;padding:14px 20px;}
.sp-input{
  flex:1;min-width:180px;background:#0B0B0E;border:1px solid #3A3A46;color:#FFF;
  font-family:"Caveat","Comic Sans MS",cursive;font-size:22px;padding:11px 12px;
}
.sp-input:focus{border-color:#E8368F;background:#150E13;}
.manual-head{
  padding:14px 14px 0;font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:#6E6E78;
}
.sp-off{border:1px dashed #33333D;padding:10px;font-size:11px;color:#9A9AA4;line-height:1.7;}

/* Per-row Spotify status. A song that cannot be matched is the one thing a
   fan must see BEFORE they hit create, not in an error afterwards. */
.chip-slot{flex:0 0 auto;display:flex;}
.sp-chip{
  flex:0 0 auto;font:700 9px/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:.09em;
  text-transform:uppercase;padding:4px 6px;border:1px solid;white-space:nowrap;
}
.sp-chip.ok{color:#1DB954;border-color:#1A7A3C;background:#0B1A11;}
.sp-chip.no{color:#E0B050;border-color:#7A5000;background:#1A1408;}
.sp-chip.wait{color:#8A8A94;border-color:#33333D;}
.results li.have{opacity:.45;}
.results li.have b:after{content:" · already on your disc";color:#1DB954;font-weight:400;}
.sp-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.sp-note{margin-top:10px;font-size:11px;color:#8A8A94;line-height:1.7;}
.sp-note b{color:#E0B050;}
.sp-acct{
  display:flex;align-items:center;gap:8px;justify-content:space-between;
  font-size:11px;color:#8A8A94;margin-bottom:10px;
}
.sp-acct .who{color:#1DB954;font-weight:700;}
.linkbtn{
  background:none;border:0;color:#8FD0FF;font-size:11px;cursor:pointer;
  padding:4px;text-decoration:underline;
}
.sp-off code{color:#E8368F;}
.results{list-style:none;margin:10px 0 0;padding:0;max-height:240px;overflow-y:auto;}
.results li{display:flex;gap:9px;align-items:center;padding:8px;border-top:1px solid #212129;
  font-size:12px;cursor:pointer;}
.results li:hover{background:#1C1C23;}
.results li .body{flex:1;min-width:0;}
.results li .out{
  flex:0 0 auto;color:#1DB954;font-size:14px;text-decoration:none;padding:4px 6px;
  border:1px solid #1A7A3C;line-height:1;
}
.results li .out:hover{background:#0B1A11;}
.sp-credit{
  margin-top:10px;font-size:10px;color:#6E6E78;letter-spacing:.04em;
}
.sp-credit a{color:#1DB954;text-decoration:none;}
.sp-credit a:hover{text-decoration:underline;}
.results li b{display:block;color:#FFF;}
.results li span{color:#8A8A94;font-size:11px;}

@media (max-width:600px){
  body{padding:10px 8px 32px;}
  .tr{flex-wrap:wrap;gap:7px;}
  .tr .f{flex-direction:column;width:100%;order:3;flex-basis:100%;}
  .tr .n{order:1;}
  .tr .ctl{order:2;margin-left:auto;}
  .tr .ctl button{width:38px;height:38px;}
  .tr.locked .fixed{order:3;flex-basis:100%;}
  .chip-slot{order:2;}
  /* keep the pinned row reading 01 - status - PINNED once it wraps */
  .pin{order:4;}
  .btn{flex:1 1 auto;min-height:44px;}
  /* 16px+ keeps iOS from zooming the page on focus */
  .fields input,.tr .f input{font-size:20px;}
}
</style>
</head>
<body>

<div class="wrap">
  <div class="disc-stage">
    <canvas id="disc" width="1080" height="1080" aria-label="Your mix CD"></canvas>
    <div class="disc-cap" id="disc-cap">your disc updates as you type</div>
  </div>

  <div class="panel">
    <h2>Burn Your Mix</h2>
    <div class="fields">
      <div>
        <label for="pl-by">Made by</label>
        <input id="pl-by" type="text" maxlength="28" placeholder="ur name">
      </div>
    </div>

    <div class="sp sp-primary">
      <h2>Search Spotify</h2>
      <div id="sp-body"></div>
    </div>

    <div class="manual-head">or type them in</div>
    <ol class="tracks" id="tracks"></ol>

    <div class="actions">
      <button type="button" class="btn go" id="add">+ Add Track</button>
      <button type="button" class="btn" id="copy">Copy As Text</button>
      <button type="button" class="btn" id="clear">Clear</button>
    </div>
    <div class="status" id="status" role="status" aria-live="polite"></div>

    <div class="actions" id="sharebar">
      <button type="button" class="btn go" id="share" hidden>Share Disc</button>
      <button type="button" class="btn" id="save">Save Disc</button>
      <a class="btn" id="sx" href="#" target="_blank" rel="noopener">X</a>
      <a class="btn" id="stu" href="#" target="_blank" rel="noopener">Tumblr</a>
      <button type="button" class="btn" id="slink">Copy Link</button>
    </div>

    <p class="note">
      Your mix stays in this browser. The disc is drawn on your device &mdash;
      nothing is uploaded. If there's no Save button, long-press or right-click the disc.
    </p>
  </div>
</div>

<script>
(function(){
  var CFG = window.__PL;
  var KEY = 'jb-playlist-v2';
  var $ = function(id){ return document.getElementById(id); };
  function say(m){ $('status').textContent = m || ''; }
  function esc(v){
    return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  var state = {by:'', tracks:[{t:'',a:''},{t:'',a:''},{t:'',a:''}]};
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if(saved && Array.isArray(saved.tracks)) state = saved;
  } catch(e){}
  function persist(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }

  /* The Spotify layer fills this in; the form only ever reads it, so the page
     works exactly the same with Spotify switched off. */
  var SPX = {connected:false, resolve:null};

  /* A link of the form #m=<packed> carries someone else's mix. Load it over
     whatever is saved - following a shared link is an explicit act. */
  var sharedMix = null;
  try {
    var mh = (location.hash || '').match(/[#&]m=([A-Za-z0-9_-]+)/);
    if(mh){
      var padded = mh[1].replace(/-/g,'+').replace(/_/g,'/');
      while(padded.length % 4) padded += '=';
      var raw = atob(padded), u8 = new Uint8Array(raw.length);
      for(var bi = 0; bi < raw.length; bi++) u8[bi] = raw.charCodeAt(bi);
      var got = JSON.parse(new TextDecoder().decode(u8));
      if(got && Array.isArray(got.t)){
        sharedMix = {
          by: typeof got.b === 'string' ? got.b.slice(0,28) : '',
          tracks: got.t.slice(0, 24).map(function(r){
            return {t: String(r[0] || '').slice(0,42), a: String(r[1] || '').slice(0,30)};
          })
        };
        if(!sharedMix.tracks.length) sharedMix = null;
      }
    }
  } catch(e){ sharedMix = null; }
  if(sharedMix){ state = {by: sharedMix.by, tracks: sharedMix.tracks}; persist(); }

     hub start to its right, the way you write around the hole. */

     "Sedgwick Ave Display" (fatter), "Just Another Hand" (tall + narrow).
     Whatever goes first, the title sizes itself to fit the disc below. */
  var SHARPIE = '"Rock Salt","Permanent Marker","Comic Sans MS",cursive';
  var MARKER = '"Permanent Marker","Comic Sans MS",cursive';
  var HAND   = '"Caveat","Comic Sans MS",cursive';

  function heart(c, x, y, s, broken){
    c.save(); c.translate(x,y); c.scale(s,s);
    c.beginPath();
    c.moveTo(0,3);
    c.bezierCurveTo(-6,-4,-13,1,-8,7);
    c.bezierCurveTo(-5,11,0,14,0,14);
    c.bezierCurveTo(0,14,5,11,8,7);
    c.bezierCurveTo(13,1,6,-4,0,3);
    c.closePath(); c.fill();
    if(broken){
      c.strokeStyle = '#0A0A0C'; c.lineWidth = 1.6; c.lineJoin = 'miter';
      c.beginPath();
      c.moveTo(0,3); c.lineTo(2.4,6.4); c.lineTo(-1.4,9); c.lineTo(1.2,13.6);
      c.stroke();
    }
    c.restore();
  }

  /* Text bent along a circle. `flip` puts it on the bottom rim still reading
     left to right, instead of upside down. */
  function arcText(c, text, cx, cy, radius, centerAngle, gap, flip){
    var widths = [], total = 0;
    for(var i = 0; i < text.length; i++){
      var w = c.measureText(text[i]).width + gap;
      widths.push(w); total += w;
    }
    var span = total / radius;
    var acc = centerAngle + (flip ? span/2 : -span/2);
    for(var j = 0; j < text.length; j++){
      var idx = flip ? j : j;
      var step = widths[idx] / radius;
      var a = flip ? acc - step/2 : acc + step/2;
      c.save();
      c.translate(cx + Math.cos(a)*radius, cy + Math.sin(a)*radius);
      c.rotate(flip ? a - Math.PI/2 : a + Math.PI/2);
      c.fillText(text[idx], 0, 0);
      c.restore();
      acc += flip ? -step : step;
    }
  }

  var art = null;
  if(CFG.discArt){
    art = new Image();
    art.onload = function(){ drawDisc($('disc')); };
    art.src = CFG.discArt;
  }

  function drawDisc(cv, cb){
    var S = cv.width, cx = S/2, cy = S/2;
    var R = S*0.462, HUB = S*0.109, HOLE = S*0.0435;
    var c = cv.getContext('2d');
    c.setTransform(1,0,0,1,0,0);
    c.clearRect(0,0,S,S);

    /* table */
    c.fillStyle = '#0A0A0C';
    c.fillRect(0,0,S,S);

    /* the real disc */
    if(art && art.complete && art.naturalWidth){
      c.save();
      c.beginPath(); c.arc(cx,cy,R,0,Math.PI*2); c.closePath(); c.clip();
      /* The artwork is a square photo with black around it: its disc measures
         0.785 of the frame, centred at (0.494, 0.501). Scale by that so the
         photographed disc lands exactly on ours instead of floating inside it. */
      var ART_FRAC = 0.781, ART_CX = 0.497, ART_CY = 0.502;
      var d = R*2 / ART_FRAC;
      c.drawImage(art, cx - d*ART_CX, cy - d*ART_CY, d, d);
      c.restore();
    } else {
      c.fillStyle = '#C9CCD3';
      c.beginPath(); c.arc(cx,cy,R,0,Math.PI*2); c.fill();
    }

    /* ---- marker: title straight across the top ---- */
    /* Black sharpie caps, written flat near the top edge. The disc is round,
       so the room the title has is the chord at that height, not the disc's
       full width - and Rock Salt sets wide. Size the title to that chord
       rather than to a fixed number, so a longer mix name shrinks instead of
       running off the edge. */
    var title = CFG.mixName.toUpperCase();
    var tY = cy - R*0.66, tfs;
    var tRoom = Math.sqrt(Math.max(0, R*R - (tY-cy)*(tY-cy))) * 2 * 0.88;
    for(tfs = S*0.052; tfs > S*0.024; tfs -= 1){
      c.font = '400 ' + Math.round(tfs) + 'px ' + SHARPIE;
      if(c.measureText(title).width <= tRoom) break;
    }
    c.fillStyle = '#131318';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(title, cx, tY);
    /* Tracks start under the title. Measure where that is rather than
       guessing a clearance that stops being true the moment the font or the
       name changes. */
    var titleBottom = tY + tfs*0.60;

    /* byline rides the bottom rim, so the whole face is free for tracks */
    if(state.by){
      c.font = '400 ' + Math.round(S*0.030) + 'px ' + HAND;
      c.fillStyle = '#C0246F';
      arcText(c, '~ ' + state.by + ' ~', cx, cy, R*0.86, Math.PI/2, S*0.003, true);
    }

    /* ---- the tracklist, in pen ---- */
    var rows = [{n:1, t:CFG.locked.title, a:CFG.locked.artist}];
    filled().forEach(function(t,i){ rows.push({n:i+2, t:t.t.trim(), a:t.a.trim()}); });

    /* No line crosses the hub: slots skip that band entirely, so every track
       gets the disc's full width instead of a gutter beside the hole.
       Shrink the line height until enough slots exist for the whole list. */
    var lh, fs, slots;
    for(lh = S*0.056; lh > S*0.021; lh -= 1){
      fs = Math.min(S*0.042, lh*0.80);
      slots = [];
      /* starts clear of the arced title so the two never collide */
      for(var yy = Math.max(cy - R*0.50, titleBottom + lh*0.55); yy <= cy + R*0.68; yy += lh){
        if(Math.abs(yy - cy) < HUB + fs*0.80) continue;   /* the hole */
        slots.push(yy);
      }
      if(slots.length >= rows.length) break;
    }

    c.font = '700 ' + Math.round(fs) + 'px ' + HAND;
    c.textAlign = 'left'; c.textBaseline = 'middle';

    rows.forEach(function(row, i){
      var y = slots[i];
      if(y === undefined) return;
      /* the disc is round, so usable width depends on how high up we are */
      var half = Math.sqrt(Math.max(0, R*R - (y-cy)*(y-cy))) * 0.86;
      var x = cx - half, right = cx + half;
      /* Prefer dropping the artist over clipping the song — a truncated
         title reads as a mistake, especially on the pinned track. */
      var label = row.n + '- ' + row.t + (row.a ? ' - ' + row.a : '');
      if(c.measureText(label).width > (right - x) && row.a){
        label = row.n + '- ' + row.t;
      }
      while(c.measureText(label).width > (right - x) && label.length > 6){
        label = label.slice(0, -2) + '…';
      }
      c.save();
      c.translate(x, y);
      c.rotate(-0.012 + Math.random()*0.024);   /* hand-written wobble */
      /* light halo first: the disc underneath is busy and rainbow-coloured */
      c.lineJoin = 'round';
      c.lineWidth = Math.max(2, fs*0.22);
      c.strokeStyle = 'rgba(255,255,255,0.45)';
      c.strokeText(label, 0, 0);
      c.fillStyle = row.n === 1 ? '#0D0D12' : '#191920';
      c.fillText(label, 0, 0);
      c.restore();
    });

    /* ---- doodles, if the list left room ---- */
    /* The disc is blank now, so the doodles are ours again. Sit them just
       under the last track rather than at a fixed radius — otherwise a short
       list leaves a gap and a long one pushes them off the face. */
    /* Sit them in the gap between the last track and the byline on the rim,
       and skip only when that gap is genuinely too small. Keying off a fixed
       radius meant any change to the slot range silently dropped them. */
    var lastY = slots.length ? slots[Math.min(rows.length, slots.length) - 1] : cy;
    var rimY = cy + R*0.76;
    var gap = rimY - lastY;
    if(gap > lh*1.5){
      c.fillStyle = '#16161C';
      var dy = lastY + gap*0.45;
      heart(c, cx - S*0.058, dy, S*0.0030, true);
      heart(c, cx + S*0.058, dy, S*0.0030, false);
    }

    /* ---- where it came from ---- */
    c.textAlign = 'center'; c.textBaseline = 'alphabetic';
    c.font = '400 ' + Math.round(S*0.022) + 'px ' + HAND;
    c.fillStyle = '#6E6E78';
    c.fillText('jonasbrothers.com', cx, S - S*0.018);

    if(cb) cb(cv);
  }

  /* ---------------- form ---------------- */
  var list = $('tracks');

  /* A song with no Spotify match still belongs on the disc - it just cannot
     travel to the playlist. Saying so per row, while they type, beats a
     surprise in the create summary. */
  function chipHtml(tr){
    if(!SPX.connected) return '';
    if(!(tr.t || '').trim()) return '';
    if(tr.uri) return '<span class="sp-chip ok">on spotify</span>';
    if(tr.sp === 'no') return '<span class="sp-chip no">not found</span>';
    return '<span class="sp-chip wait">checking</span>';
  }
  function paintChips(){
    var rows = list.querySelectorAll('.tr');
    for(var i = 1; i < rows.length; i++){
      var slot = rows[i].querySelector('.chip-slot');
      if(slot) slot.innerHTML = chipHtml(state.tracks[i-1] || {});
    }
    var lslot = rows[0] && rows[0].querySelector('.chip-slot');
    if(lslot) lslot.innerHTML = SPX.connected && CFG.locked.uri
      ? '<span class="sp-chip ok">on spotify</span>' : '';
  }
  function render(){
    list.innerHTML = '';
    var li = document.createElement('li');
    li.className = 'tr locked';
    li.innerHTML = '<span class="n">01</span>' +
      '<span class="fixed"><b>' + esc(CFG.locked.title) + '</b>' +
      '<span>' + esc(CFG.locked.artist) + '</span></span>' +
      '<span class="chip-slot"></span>' +
      '<span class="pin">PINNED</span>';
    list.appendChild(li);

    state.tracks.forEach(function(tr,i){
      var n = i+2;
      var row = document.createElement('li');
      row.className = 'tr';
      row.innerHTML =
        '<span class="n">' + (n<10?'0'+n:n) + '</span>' +
        '<span class="chip-slot"></span>' +
        '<span class="f">' +
          '<input class="t" type="text" maxlength="42" placeholder="song" value="' + esc(tr.t) + '">' +
          '<input class="a" type="text" maxlength="30" placeholder="artist" value="' + esc(tr.a) + '">' +
        '</span>' +
        '<span class="ctl">' +
          '<button type="button" data-up="' + i + '" aria-label="Move up"' + (i===0?' disabled':'') + '>&#9650;</button>' +
          '<button type="button" data-down="' + i + '" aria-label="Move down"' + (i===state.tracks.length-1?' disabled':'') + '>&#9660;</button>' +
          '<button type="button" data-del="' + i + '" aria-label="Remove">&times;</button>' +
        '</span>';
      list.appendChild(row);
    });
    $('add').disabled = state.tracks.length >= CFG.maxTracks - 1;
    paintChips();
    refreshShare();
    preview();
  }

  var pending = null, drawnOnce = false;
  function preview(){
    /* First paint is synchronous: rAF can be starved (background tab, some
       embedded viewers) and the disc must never come up blank. */
    if(!drawnOnce){ drawnOnce = true; drawDisc($('disc')); return; }
    if(pending) cancelAnimationFrame(pending);
    pending = requestAnimationFrame(function(){ drawDisc($('disc')); });
  }

  var reMatch = {};
  list.addEventListener('input', function(e){
    var row = e.target.closest('.tr'); if(!row) return;
    var i = [].indexOf.call(list.children, row) - 1; if(i < 0) return;
    if(e.target.classList.contains('t')) state.tracks[i].t = e.target.value;
    else if(e.target.classList.contains('a')) state.tracks[i].a = e.target.value;
    else return;
    /* Edited text is no longer the song that was matched, so drop the link to
       Spotify and look it up again once they stop typing. */
    delete state.tracks[i].uri;
    delete state.tracks[i].sp;
    var slot = row.querySelector('.chip-slot');
    if(slot) slot.innerHTML = chipHtml(state.tracks[i]);
    if(SPX.connected && SPX.resolve){
      clearTimeout(reMatch[i]);
      reMatch[i] = setTimeout(function(){ SPX.resolve(i); }, 700);
    }
    persist(); refreshShare(); preview();
  });

  list.addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    var up=b.getAttribute('data-up'), dn=b.getAttribute('data-down'), del=b.getAttribute('data-del'), s;
    if(up !== null){ var i=+up; s=state.tracks.splice(i,1)[0]; state.tracks.splice(i-1,0,s); }
    else if(dn !== null){ var j=+dn; s=state.tracks.splice(j,1)[0]; state.tracks.splice(j+1,0,s); }
    else if(del !== null){ state.tracks.splice(+del,1); if(!state.tracks.length) state.tracks.push({t:'',a:''}); }
    else return;
    persist(); render();
  });

  $('add').addEventListener('click', function(){
    if(state.tracks.length >= CFG.maxTracks - 1){ say('That is the whole disc.'); return; }
    state.tracks.push({t:'',a:''}); persist(); render();
    var ins = list.querySelectorAll('.tr .t');
    if(ins.length) ins[ins.length-1].focus();
  });

  $('pl-by').value = state.by;
  $('pl-by').addEventListener('input', function(){ state.by = this.value; persist(); preview(); });

  function asText(){
    var out = [CFG.mixName.toUpperCase()];
    if(state.by) out.push('by ' + state.by);
    out.push('');
    out.push('1- ' + CFG.locked.title + ' - ' + CFG.locked.artist);
    filled().forEach(function(t,i){
      out.push((i+2) + '- ' + t.t.trim() + (t.a.trim() ? ' - ' + t.a.trim() : ''));
    });
    out.push('', 'burn yours at ' + CFG.shareUrl);
    return out.join('\n');
  }

  /* ---------------- share ---------------- */
  var blob = null;
  function refreshBlob(){
    $('disc').toBlob(function(b){ blob = b; }, 'image/png');
  }

  $('copy').addEventListener('click', function(){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(asText()).then(
        function(){ say('Copied — paste it anywhere.'); },
        function(){ say('Copy blocked by the browser.'); });
    } else say('Copy blocked by the browser.');
  });
  $('slink').addEventListener('click', function(){
    var url = mixLink();
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(
        function(){ say(url === CFG.shareUrl ? 'Link copied.' : 'Link copied — it opens your disc.'); },
        function(){ say('Copy blocked.'); });
    } else say('Copy blocked by the browser.');
  });
  $('clear').addEventListener('click', function(){
    state = {by:'', tracks:[{t:'',a:''},{t:'',a:''},{t:'',a:''}]};
    try { localStorage.removeItem(KEY); } catch(e){}
    $('pl-by').value='';
    render(); say('Cleared.');
  });

  /* A share link carries the mix itself, so opening it shows THAT disc rather
     than an empty one. It rides in the fragment, not the query string: the
     Spotify redirect comes back with ?code=... and the two must not collide. */
  function utf8b64(str){
    var bytes = new TextEncoder().encode(str), bin = '';
    for(var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  }
  function b64utf8(b64){
    var pad = b64.replace(/-/g,'+').replace(/_/g,'/');
    while(pad.length % 4) pad += '=';
    var bin = atob(pad), bytes = new Uint8Array(bin.length);
    for(var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }
  function mixLink(){
    var songs = filled().map(function(t){ return [t.t.trim(), (t.a||'').trim()]; });
    if(!songs.length && !state.by) return CFG.shareUrl;
    var packed = utf8b64(JSON.stringify({b: state.by || '', t: songs}));
    /* Long mixes can outgrow what some apps will carry. Fall back to the
       plain page rather than handing out a link that arrives truncated. */
    var url = CFG.shareUrl + '#m=' + packed;
    return url.length > 1800 ? CFG.shareUrl : url;
  }
  function refreshShare(){
    var t = encodeURIComponent('my listen when sad playlist — track 1 is non-negotiable');
    var u = encodeURIComponent(mixLink());
    $('sx').href = 'https://twitter.com/intent/tweet?text=' + t + '&url=' + u;
    $('stu').href = 'https://www.tumblr.com/widgets/share/tool?canonicalUrl=' + u + '&caption=' + t;
  }
  refreshShare();

  /* On a phone the share sheet can carry the picture itself, which is what
     fans actually do - the link alone arrives as a naked URL in iMessage. Not
     every browser can share files, so the button hides itself rather than
     failing when tapped. */
  function discFile(){
    return new Promise(function(resolve){
      var cv = $('disc');
      if(!cv.toBlob || typeof File !== 'function') return resolve(null);
      try {
        cv.toBlob(function(b){
          if(!b) return resolve(null);
          try { resolve(new File([b], fileName(), {type:'image/png'})); }
          catch(e){ resolve(null); }
        }, 'image/png');
      } catch(e){ resolve(null); }
    });
  }

  var shareBtn = $('share');
  shareBtn.hidden = !(navigator.share && navigator.canShare);
  shareBtn.addEventListener('click', function(){
    var link = mixLink();
    var text = 'my listen when sad playlist — track 1 is non-negotiable';
    discFile().then(function(f){
      if(f && navigator.canShare({files:[f]})){
        /* Several platforms drop `url` once a file rides along, so the link
           goes in the text, where it always survives. */
        return navigator.share({files:[f], text: text + ' ' + link});
      }
      return navigator.share({title: CFG.mixName, text: text, url: link});
    }).then(function(){
      say('Shared.');
    }, function(err){
      if(err && err.name === 'AbortError') return;      /* they backed out */
      say('Sharing is not available here — use Save Disc and Copy Link.');
    });
  });

  var saveBtn = $('save');
  function fileName(){
    var n = (state.by || 'my').trim().replace(/[^\w-]+/g,'-').slice(0,40) || 'my';
    return n + '-listen-when-sad.png';
  }
  saveBtn.hidden = true;
  if(window.claude && typeof window.claude.use === 'function'){
    window.claude.use('downloads').then(function(d){
      if(!d) return;
      saveBtn.hidden = false;
      saveBtn.addEventListener('click', function(){
        refreshBlob();
        setTimeout(function(){
          if(!blob){ say('Give it a second, then try again.'); return; }
          d.save({filename:fileName(), data:blob}).then(
            function(){ say('Saved.'); },
            function(err){
              if(err && err.code === 'declined') say('No problem — the disc is still here.');
              else { say('Saving is unavailable here — long-press the disc.'); saveBtn.hidden = true; }
            });
        }, 120);
      });
    });
  } else {
    saveBtn.hidden = false;
    saveBtn.addEventListener('click', function(){
      refreshBlob();
      setTimeout(function(){
        if(!blob){ say('Give it a second, then try again.'); return; }
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = fileName();
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
        say('Saved to your downloads.');
      }, 120);
    });
  }

  /* draw once now, and again once the marker fonts land */
  render();
  if(document.fonts && document.fonts.load){
    Promise.all([
      document.fonts.load('400 46px "Rock Salt"'),
      document.fonts.load('400 62px "Permanent Marker"'),
      document.fonts.load('700 42px "Caveat"')
    ]).then(preview).catch(function(){});
    document.fonts.ready.then(preview).catch(function(){});
  }

  window.__PL_API = {
    state: state,
    addTrack: function(title, artist, uri){
      var slot = null;
      for(var i=0;i<state.tracks.length;i++){
        if(!(state.tracks[i].t||'').trim()){ slot = i; break; }
      }
      if(slot === null){
        if(state.tracks.length >= CFG.maxTracks - 1) return false;
        state.tracks.push({t:'',a:''}); slot = state.tracks.length - 1;
      }
      state.tracks[slot] = {t:title, a:artist, uri:uri};
      persist(); render();
      return true;
    },
    filled: filled,
    say: say,

    /* --- for the Spotify layer --- */
    spx: SPX,
    /* Record what a lookup found. A miss is remembered too, so the row shows
       "not found" instead of sitting on "checking" forever. */
    setMatch: function(i, uri){
      var tr = state.tracks[i];
      if(!tr) return;
      if(uri){ tr.uri = uri; delete tr.sp; }
      else { delete tr.uri; tr.sp = 'no'; }
      persist(); paintChips();
    },
    /* Every row that needs a lookup, newest state, with its index. */
    unmatched: function(){
      var out = [];
      state.tracks.forEach(function(tr, i){
        if((tr.t||'').trim() && !tr.uri) out.push({i:i, t:tr.t.trim(), a:(tr.a||'').trim()});
      });
      return out;
    },
    /* The pinned track first, then every row that resolved to a real song. */
    uris: function(){
      var u = [];
      if(CFG.locked.uri) u.push(CFG.locked.uri);
      filled().forEach(function(t){ if(t.uri && u.indexOf(t.uri) === -1) u.push(t.uri); });
      return u;
    },
    /* Songs that will NOT travel to Spotify, so the summary can name them. */
    missing: function(){
      return filled().filter(function(t){ return !t.uri; })
                     .map(function(t){ return t.t.trim(); });
    },
    hasUri: function(uri){
      if(uri && CFG.locked.uri === uri) return true;
      return state.tracks.some(function(t){ return t.uri === uri; });
    },
    repaint: paintChips,
    discCanvas: function(){ return $('disc'); },
    refresh: render
  };
})();
</script>
<script>
/* ------------------------------------------------------------------
   SPOTIFY

   Auth is Authorization Code + PKCE: no client secret, so it is safe in a
   static page. The client id in __PL is public by design. The client SECRET
   is never used here and must never be put in this file.

   Beyond signing in, this layer:
     - matches every hand-typed row against the real catalogue, so a mix
       somebody typed out arrives complete instead of as one pinned song
     - creates the playlist on the listener's own account, pinned track first
     - uploads their disc as the playlist's cover art
     - refreshes the session, so it does not die after an hour
     - updates the same playlist on a second press instead of piling up copies

   NOT EXERCISED AGAINST THE LIVE API from the machine this was written on -
   it cannot reach accounts.spotify.com. Every branch below is driven by a
   fake Spotify in test/spotify-mock.html; the contract is from Spotify's
   docs. Run the real thing once before launch.
   ------------------------------------------------------------------ */
(function(){
  var CFG = window.__PL, API = window.__PL_API;
  var SP = CFG.spotify;
  var SPX = API.spx;
  var body = document.getElementById('sp-body');

  function esc(v){
    return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function delay(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
  function el(id){ return document.getElementById(id); }

  var TOK_KEY = 'jb-sp-tok', VERIFIER_KEY = 'jb-sp-verifier', PL_KEY = 'jb-sp-playlist';
  var AUTH = 'https://accounts.spotify.com/authorize';
  var TOKEN = 'https://accounts.spotify.com/api/token';
  var redirectUri = location.origin + location.pathname;

  /* Storage can throw outright in private mode, so every touch is guarded. */
  function readJSON(k){ try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch(e){ return null; } }
  function writeJSON(k, v){
    try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch(e){}
  }

  if(!SP.clientId){
    body.innerHTML =
      '<p>Fans can build and share a disc right now. Connecting Spotify adds real ' +
      'search and one-tap playlist creation on the listener\'s own account.</p>' +
      '<div class="sp-off"><b>Not configured.</b><br>' +
      '1. Create an app at developer.spotify.com/dashboard<br>' +
      '2. Add this exact redirect URI: <code>' + esc(redirectUri) + '</code><br>' +
      '3. Paste the client id into <code>__PL.spotify.clientId</code><br>' +
      '4. Paste the pinned track URI into <code>__PL.locked.uri</code><br>' +
      '<br>New apps are capped at 25 named users until Spotify grants a quota ' +
      'extension — request that before any public push.</div>';
    return;
  }

  /* ================= PKCE ================= */
  function rand(n){
    var a = new Uint8Array(n);
    crypto.getRandomValues(a);
    return Array.from(a).map(function(x){
      return 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~'[x % 66];
    }).join('');
  }
  function b64url(buf){
    return btoa(String.fromCharCode.apply(null, new Uint8Array(buf)))
      .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  }
  function challenge(v){
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)).then(b64url);
  }

  function login(){
    var v = rand(64);
    try { sessionStorage.setItem(VERIFIER_KEY, v); } catch(e){
      API.say('This browser is blocking storage, so sign-in cannot complete.');
      return;
    }
    challenge(v).then(function(ch){
      location.href = AUTH + '?' + new URLSearchParams({
        client_id: SP.clientId,
        response_type: 'code',
        redirect_uri: redirectUri,
        code_challenge_method: 'S256',
        code_challenge: ch,
        scope: SP.scopes.join(' ')
      }).toString();
    });
  }

  function store(j){
    var t = readJSON(TOK_KEY) || {};
    t.access = j.access_token;
    t.exp = Date.now() + ((j.expires_in || 3600) * 1000);
    /* A refresh response may omit the refresh token; keep the one we have. */
    if(j.refresh_token) t.refresh = j.refresh_token;
    writeJSON(TOK_KEY, t);
    return t.access;
  }

  function exchange(code){
    var v = null;
    try { v = sessionStorage.getItem(VERIFIER_KEY); } catch(e){}
    if(!v) return Promise.reject(new Error('Sign-in could not be completed in this tab. Try connecting again.'));
    return fetch(TOKEN, {
      method: 'POST',
      headers: {'Content-Type':'application/x-www-form-urlencoded'},
      body: new URLSearchParams({
        grant_type: 'authorization_code',
        code: code,
        redirect_uri: redirectUri,
        client_id: SP.clientId,
        code_verifier: v
      })
    }).then(function(r){
      if(!r.ok) return r.text().then(function(t){
        throw new Error('Spotify would not issue a token (' + r.status + '). ' +
          'Usually the redirect URI does not match the one registered.');
      });
      return r.json();
    }).then(function(j){
      try { sessionStorage.removeItem(VERIFIER_KEY); } catch(e){}
      return store(j);
    });
  }

  /* One refresh at a time: several calls can find the token stale at once,
     and Spotify rotates refresh tokens, so a second exchange would fail. */
  /* Any way a session can end - a rejected refresh, a 401 that survived a
     retry - has to put the UI back to Connect. Clearing the token while the
     screen still says "connected" leaves no way back in. */
  function sessionLost(){
    writeJSON(TOK_KEY, null);
    SPX.connected = false;
    API.repaint();
    disconnected();
  }

  var refreshing = null;
  function doRefresh(rt){
    return fetch(TOKEN, {
      method: 'POST',
      headers: {'Content-Type':'application/x-www-form-urlencoded'},
      body: new URLSearchParams({
        grant_type: 'refresh_token',
        refresh_token: rt,
        client_id: SP.clientId
      })
    }).then(function(r){
      if(!r.ok) throw new Error('refresh rejected');
      return r.json();
    }).then(store);
  }
  function refresh(rt){
    if(refreshing) return refreshing;
    refreshing = doRefresh(rt).catch(function(){
      sessionLost();
      throw new Error('Your Spotify session ended — connect again.');
    });
    refreshing.then(function(){ refreshing = null; }, function(){ refreshing = null; });
    return refreshing;
  }

  /* A valid access token, refreshing first if it is stale or nearly so. */
  function fresh(){
    var t = readJSON(TOK_KEY);
    if(!t || !t.access) return Promise.reject(new Error('Not connected to Spotify.'));
    if(Date.now() < (t.exp || 0) - 60000) return Promise.resolve(t.access);
    if(!t.refresh){
      sessionLost();
      return Promise.reject(new Error('Your Spotify session ended — connect again.'));
    }
    return refresh(t.refresh);
  }
  function signedIn(){ var t = readJSON(TOK_KEY); return !!(t && t.access); }

  /* ================= the API call ================= */
  function explain(status, text){
    if(status === 403){
      return 'Spotify refused that (403). Either this account is not on the ' +
             'app\'s allow-list — apps in Development Mode are limited to 25 ' +
             'named users — or it did not grant playlist permission. Sign out ' +
             'and connect again, and accept every permission Spotify asks for.';
    }
    if(status === 404) return 'Spotify could not find that (404). The playlist may have been deleted.';
    if(status === 413) return 'That image was too large for Spotify.';
    var snip = (text || '').slice(0, 140);
    return 'Spotify returned ' + status + (snip ? ': ' + snip : '') + '.';
  }

  function api(path, opts, retried){
    opts = opts || {};
    return fresh().then(function(at){
      var h = Object.assign({'Authorization': 'Bearer ' + at}, opts.headers || {});
      if(opts.body && !h['Content-Type']) h['Content-Type'] = 'application/json';
      return fetch('https://api.spotify.com/v1' + path, {
        method: opts.method || 'GET', headers: h, body: opts.body
      }).catch(function(){
        throw new Error('Could not reach Spotify. Check the connection and try again.');
      });
    }).then(function(r){
      /* One retry each for a stale token, a rate limit, and a server blip. */
      if(r.status === 401 && !retried){
        var t = readJSON(TOK_KEY);
        if(t){ t.exp = 0; writeJSON(TOK_KEY, t); }
        return api(path, opts, true);
      }
      if(r.status === 429 && !retried){
        var wait = (parseInt(r.headers.get('Retry-After') || '1', 10) || 1) * 1000;
        return delay(Math.min(wait, 8000)).then(function(){ return api(path, opts, true); });
      }
      if(r.status >= 500 && !retried){
        return delay(800).then(function(){ return api(path, opts, true); });
      }
      if(r.status === 401){
        sessionLost();
        throw new Error('Your Spotify session ended — connect again.');
      }
      if(!r.ok) return r.text().then(function(t){ throw new Error(explain(r.status, t)); });
      if(r.status === 204) return null;
      return r.text().then(function(t){ return t ? JSON.parse(t) : null; });
    });
  }

  /* ================= matching typed songs ================= */
  /* Fans type "Sucker" and "the jonas brothers", not catalogue strings. Strip
     everything that is decoration so a human's spelling still matches. */
  function norm(x){
    return String(x == null ? '' : x).toLowerCase()
      .replace(/\(.*?\)|\[.*?\]/g, ' ')
      .replace(/\b(feat|ft|featuring|w\/|with)\b[\s\S]*$/, ' ')
      .replace(/&/g, ' and ')
      .replace(/[^a-z0-9]+/g, ' ')
      .trim();
  }
  function near(a, b){
    if(!a || !b) return false;
    return a === b || a.indexOf(b) !== -1 || b.indexOf(a) !== -1;
  }
  function pick(items, title, artist){
    var nt = norm(title), na = norm(artist);
    for(var i = 0; i < items.length; i++){
      var it = items[i];
      if(!near(norm(it.name), nt)) continue;
      if(na){
        var who = (it.artists || []).map(function(a){ return norm(a.name); });
        var hit = who.some(function(w){ return near(w, na); });
        if(!hit) continue;
      }
      return it;
    }
    /* With no artist to check against, an exact title on the top hit is the
       most a search can honestly claim. */
    if(!na && items.length && norm(items[0].name) === nt) return items[0];
    return null;
  }
  function searchTracks(q, limit){
    return api('/search?' + new URLSearchParams({q: q, type: 'track', limit: String(limit || 8)}))
      .then(function(j){ return (j && j.tracks && j.tracks.items) || []; });
  }
  function lookup(title, artist){
    var strict = artist ? 'track:"' + title + '" artist:"' + artist + '"' : 'track:"' + title + '"';
    return searchTracks(strict, 5).then(function(items){
      var hit = pick(items, title, artist);
      if(hit) return hit;
      /* Field filters are unforgiving about spelling; a plain search is not. */
      return searchTracks((title + ' ' + artist).trim(), 8).then(function(loose){
        return pick(loose, title, artist);
      });
    });
  }

  var inflight = {};
  function resolveRow(i){
    var tr = API.state.tracks[i];
    if(!tr || !(tr.t || '').trim() || tr.uri) return Promise.resolve();
    var was = {t: tr.t, a: tr.a || ''};
    var key = i + '|' + was.t + '|' + was.a;
    if(inflight[key]) return inflight[key];
    inflight[key] = lookup(was.t.trim(), was.a.trim())
      .then(function(hit){
        var now = API.state.tracks[i];
        /* They may have kept typing: only apply to the text we searched for. */
        if(!now || now.t !== was.t || (now.a || '') !== was.a) return;
        API.setMatch(i, hit ? hit.uri : null);
      })
      .catch(function(){ /* leave it unresolved - create() tries again */ })
      .then(function(){ delete inflight[key]; });
    return inflight[key];
  }
  SPX.resolve = resolveRow;

  /* Sequential: a dozen rows at once is a burst Spotify may rate-limit, and
     there is no hurry here. */
  function resolveAll(){
    var todo = API.unmatched();
    if(!todo.length) return Promise.resolve();
    API.say('Matching your songs on Spotify…');
    return todo.reduce(function(p, row){
      return p.then(function(){ return resolveRow(row.i); });
    }, Promise.resolve());
  }

  /* ================= cover art ================= */
  /* The disc they made becomes the playlist's artwork. Spotify takes base64
     JPEG only, capped at 256KB, and JPEG has no transparency - so the disc is
     flattened onto the page's own background first. */
  function coverJpeg(){
    try {
      var src = API.discCanvas();
      if(!src || !src.width) return Promise.resolve(null);
      var cv = document.createElement('canvas'), c = cv.getContext('2d');
      var size = 640, q = 0.82, out = null;
      for(var attempt = 0; attempt < 7; attempt++){
        cv.width = cv.height = size;
        c.fillStyle = '#0A0A0C';
        c.fillRect(0, 0, size, size);
        c.drawImage(src, 0, 0, size, size);
        out = (cv.toDataURL('image/jpeg', q).split(',')[1] || '');
        if(out.length <= 256 * 1024) return Promise.resolve(out);
        if(q > 0.5) q -= 0.12; else size = Math.round(size * 0.8);
      }
      return Promise.resolve(null);
    } catch(e){ return Promise.resolve(null); }
  }
  function putCover(id, b64){
    return api('/playlists/' + id + '/images', {
      method: 'PUT', headers: {'Content-Type': 'image/jpeg'}, body: b64
    });
  }

  /* ================= create / update ================= */
  function playlistName(){
    return CFG.mixName + (API.state.by ? ' — ' + API.state.by : '');
  }
  function describe(){
    return 'Track 1 is non-negotiable. Made at ' + CFG.shareUrl;
  }
  function wantPublic(){
    var box = el('sp-public');
    return box ? !!box.checked : !!SP.playlistPublic;
  }

  function createNew(uris){
    return api('/me').then(function(me){
      return api('/users/' + encodeURIComponent(me.id) + '/playlists', {
        method: 'POST',
        body: JSON.stringify({name: playlistName(), public: wantPublic(), description: describe()})
      });
    }).then(function(pl){
      return api('/playlists/' + pl.id + '/tracks', {
        method: 'POST', body: JSON.stringify({uris: uris})
      }).then(function(){
        var url = (pl.external_urls && pl.external_urls.spotify) || '';
        writeJSON(PL_KEY, {id: pl.id, url: url});
        return {id: pl.id, url: url, made: true, count: uris.length};
      });
    });
  }

  function updateExisting(saved, uris){
    /* PUT replaces the whole tracklist, so reordering on the disc reorders on
       Spotify rather than appending a second copy of everything. */
    return api('/playlists/' + saved.id + '/tracks', {
      method: 'PUT', body: JSON.stringify({uris: uris})
    }).then(function(){
      return api('/playlists/' + saved.id, {
        method: 'PUT',
        body: JSON.stringify({name: playlistName(), public: wantPublic(), description: describe()})
      });
    }).then(function(){
      return {id: saved.id, url: saved.url, made: false, count: uris.length};
    });
  }

  var busy = false;
  function push(){
    if(busy) return;
    var btn = el('sp-make');
    busy = true;
    if(btn){ btn.disabled = true; btn.textContent = 'Working…'; }

    resolveAll().then(function(){
      var uris = API.uris();
      if(!uris.length) throw new Error('Add some songs first — none of these could be found on Spotify.');
      var saved = readJSON(PL_KEY);
      if(saved && saved.id){
        return updateExisting(saved, uris).catch(function(e){
          /* Deleted on Spotify's side: start a fresh one rather than dead-end. */
          writeJSON(PL_KEY, null);
          return createNew(uris);
        });
      }
      return createNew(uris);
    }).then(function(res){
      /* Cover art is a bonus, never a reason to fail a created playlist. */
      return coverJpeg().then(function(b64){
        if(!b64) return Object.assign(res, {cover: false});
        return putCover(res.id, b64).then(
          function(){ return Object.assign(res, {cover: true}); },
          function(){ return Object.assign(res, {cover: false}); });
      });
    }).then(function(res){
      showResult(res, API.missing());
    }).catch(function(e){
      API.say(e.message || 'Something went wrong.');
    }).then(function(){
      busy = false;
      var b = el('sp-make');
      if(b){ b.disabled = false; b.textContent = makeLabel(); }
    });
  }

  function makeLabel(){
    var saved = readJSON(PL_KEY);
    return saved && saved.id ? 'Update on Spotify' : 'Create on Spotify';
  }

  function showResult(res, missing){
    API.say((res.made ? 'Playlist created.' : 'Playlist updated.') + ' ' +
            res.count + ' song' + (res.count === 1 ? '' : 's') + ' on Spotify.');
    var box = el('sp-result');
    if(!box) return;
    var html = '';
    if(res.url){
      html += '<a class="btn go" href="' + esc(res.url) + '" target="_blank" rel="noopener" ' +
              'style="margin-top:10px">Open it in Spotify</a>';
    }
    html += '<div class="sp-note">';
    html += res.cover
      ? 'Your disc is the playlist cover.'
      : '<b>Cover art could not be set</b> — the playlist itself is fine.';
    if(missing.length){
      html += '<br><b>Not on Spotify:</b> ' + missing.map(esc).join(', ') +
              '. They stay on your disc — Spotify just has no match for them.';
    }
    html += '</div>';
    box.innerHTML = html;
  }

  /* ================= UI ================= */
  function signOut(){
    writeJSON(TOK_KEY, null);
    writeJSON(PL_KEY, null);
    SPX.connected = false;
    API.repaint();
    disconnected();
    API.say('Signed out of Spotify.');
  }

  function connected(){
    SPX.connected = true;
    var pinWarning = CFG.locked.uri ? '' :
      '<div class="sp-off" style="border-color:#8A5A00;color:#E0B050;margin-bottom:10px">' +
      '<b>Track 1 has no Spotify URI yet.</b><br>' +
      'Playlists created now will not include ' + esc(CFG.locked.title) + '. ' +
      'Paste it into <code>__PL.locked.uri</code> as <code>spotify:track:&lt;id&gt;</code>.' +
      '</div>';

    body.innerHTML =
      '<div class="sp-acct"><span>Connected<span id="sp-who"></span></span>' +
      '<button type="button" class="linkbtn" id="sp-out">Sign out</button></div>' +
      pinWarning +
      '<p>Search the real catalogue, tap a result to drop it in, then push the ' +
      'whole disc to your account. Track 1 stays pinned.</p>' +
      '<div class="sp-row">' +
        '<input id="sp-q" class="sp-input" type="text" placeholder="search a song…" ' +
        'autocomplete="off" autocorrect="off" spellcheck="false">' +
        '<button type="button" class="btn" id="sp-go">Search</button>' +
      '</div>' +
      '<ul class="results" id="sp-res"></ul>' +
      '<div class="sp-credit">Search results and playlists provided by ' +
      '<a href="https://www.spotify.com/" target="_blank" rel="noopener">Spotify</a>.</div>' +
      '<div class="sp-row" style="margin-top:12px">' +
        '<button type="button" class="btn go" id="sp-make">' + makeLabel() + '</button>' +
        '<label style="font-size:11px;color:#8A8A94;display:flex;align-items:center;gap:6px">' +
        '<input type="checkbox" id="sp-public"' + (SP.playlistPublic ? ' checked' : '') + '> public' +
        '</label>' +
      '</div>' +
      '<div id="sp-result"></div>';

    API.repaint();

    api('/me').then(function(me){
      var who = el('sp-who');
      if(who && me && (me.display_name || me.id)) who.textContent = ' as ' + (me.display_name || me.id);
    }).catch(function(){});

    var q = el('sp-q'), res = el('sp-res'), timer = null, seq = 0;

    function paintResults(items){
      if(!items.length){ res.innerHTML = '<li><span>No matches.</span></li>'; return; }
      res.innerHTML = items.map(function(t){
        var artists = (t.artists || []).map(function(a){ return a.name; }).join(', ');
        var out = (t.external_urls && t.external_urls.spotify) || '';
        /* Spotify's guidelines want their content linked back to Spotify, so
           every result can be opened there as well as added here. */
        return '<li class="' + (API.hasUri(t.uri) ? 'have' : '') + '" data-uri="' + esc(t.uri) +
               '" data-t="' + esc(t.name) + '" data-a="' + esc(artists) + '">' +
               '<span class="body"><b>' + esc(t.name) + '</b><span>' + esc(artists) + '</span></span>' +
               (out ? '<a class="out" href="' + esc(out) + '" target="_blank" rel="noopener" ' +
                      'aria-label="Open on Spotify" title="Open on Spotify">&#8599;</a>' : '') +
               '</li>';
      }).join('');
    }

    function run(){
      var term = q.value.trim();
      if(term.length < 2){ res.innerHTML = ''; return; }
      var mine = ++seq;
      API.say('Searching…');
      searchTracks(term, 8).then(function(items){
        if(mine !== seq) return;           /* a later keystroke already won */
        paintResults(items);
        API.say(items.length ? 'Tap a song to add it.' : 'No matches.');
      }).catch(function(e){
        if(mine !== seq) return;
        API.say(e.message);
      });
    }

    el('sp-go').addEventListener('click', run);
    q.addEventListener('input', function(){
      clearTimeout(timer);
      timer = setTimeout(run, 350);
    });
    q.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){ e.preventDefault(); clearTimeout(timer); run(); }
    });

    res.addEventListener('click', function(e){
      if(e.target.closest('a.out')) return;      /* opening it is not adding it */
      var li = e.target.closest('li[data-uri]');
      if(!li) return;
      var uri = li.getAttribute('data-uri');
      if(API.hasUri(uri)){ API.say('That one is already on your disc.'); return; }
      var ok = API.addTrack(li.getAttribute('data-t'), li.getAttribute('data-a'), uri);
      API.say(ok ? 'Added.' : 'That is the whole disc — remove one first.');
      if(ok) li.classList.add('have');
    });

    el('sp-make').addEventListener('click', push);
    el('sp-out').addEventListener('click', signOut);

    /* Anything they typed before connecting gets looked up now, so the chips
       are truthful before they press create. */
    resolveAll().then(function(){
      var miss = API.missing();
      if(miss.length) API.say(miss.length + ' song' + (miss.length === 1 ? '' : 's') +
                              ' could not be found on Spotify — check the marked rows.');
    });
  }

  /* Sign-in needs a top-level page served from a registered URL. Inside an
     embedded preview the frame cannot hand off to Spotify, and from an
     unregistered address Spotify rejects the request. Both used to look like
     a dead button, so say which one is happening. */
  function authBlocker(){
    var framed = false;
    try { framed = window.self !== window.top; } catch(e){ framed = true; }
    if(framed){
      return 'This page is running inside an embedded preview, which is not ' +
             'allowed to hand you over to Spotify — the button would do nothing. ' +
             'Open the hosted page directly and sign in there.';
    }
    var allowed = SP.redirectUris || [];
    if(allowed.length && allowed.indexOf(redirectUri) === -1){
      return 'This page is at <code>' + esc(redirectUri) + '</code>, but the ' +
             'Spotify app is registered for <code>' + esc(allowed[0]) + '</code>. ' +
             'Spotify matches that exactly, so sign-in would be rejected. Serve ' +
             'the page at the registered address, or add this one as a Redirect ' +
             'URI in the dashboard.';
    }
    return null;
  }

  function disconnected(){
    SPX.connected = false;
    API.repaint();
    var blocked = authBlocker();
    if(blocked){
      body.innerHTML =
        '<p>Connect Spotify to search the real catalogue and push this playlist ' +
        'to your own account, with track 1 pinned.</p>' +
        '<div class="sp-off" style="border-color:#8A5A00;color:#E0B050">' +
        '<b>Sign-in unavailable here.</b><br>' + blocked + '</div>' +
        '<p style="margin-top:10px">Everything else on this page works as normal.</p>';
      return;
    }
    body.innerHTML =
      '<p>Connect Spotify to search the real catalogue and push this playlist ' +
      'to your own account — with track 1 pinned, and your disc as the cover.</p>' +
      '<button type="button" class="btn go" id="sp-login">Connect Spotify</button>';
    el('sp-login').addEventListener('click', login);
  }

  /* ---- returning from the Spotify redirect ---- */
  var params = new URLSearchParams(location.search);
  if(params.get('code')){
    body.innerHTML = '<p>Connecting…</p>';
    exchange(params.get('code'))
      .then(function(){
        history.replaceState({}, '', redirectUri);
        connected();
      })
      .catch(function(e){
        history.replaceState({}, '', redirectUri);
        disconnected();
        API.say(e.message);
      });
  } else if(params.get('error')){
    var why = params.get('error');
    history.replaceState({}, '', redirectUri);
    disconnected();
    API.say(why === 'access_denied'
      ? 'Spotify sign-in was cancelled.'
      : 'Spotify refused the sign-in (' + why + '). If this account is not on the ' +
        'app\'s allow-list, add it in the dashboard — Development Mode allows 25.');
  } else if(signedIn()){
    connected();
  } else {
    disconnected();
  }
})();
</script>
</body>
</html>
